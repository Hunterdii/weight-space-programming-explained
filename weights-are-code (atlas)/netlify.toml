# Netlify Configuration for Weight-Space Programming Interactive Field Guide
# Co-located site configuration

[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS    = "--legacy-peer-deps"

# Canonical PDF redirect if accessed via /downloads
[[redirects]]
  from   = "/downloads/weight-space-programming.pdf"
  to     = "/whitepaper.pdf"
  status = 301

[[redirects]]
  from   = "/weight-space-programming-atlas-edition.pdf"
  to     = "/whitepaper.pdf"
  status = 301

[[redirects]]
  from   = "/atlas-edition.pdf"
  to     = "/whitepaper.pdf"
  status = 301

# Custom 404 Routing for Static Export
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Production Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://raw.githubusercontent.com;"

# Long-term Immutable Caching for Next.js Static Chunks
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static Asset Caching (Paper PDF, Icons, OpenGraph preview)
[[headers]]
  for = "/whitepaper.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
