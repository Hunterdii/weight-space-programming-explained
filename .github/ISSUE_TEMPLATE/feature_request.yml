name: 💡 Feature or Benchmark Proposal
description: Propose an extension to WSP-Bench-Lite, a new lab experiment, or pedagogical visualizer
title: "[PROPOSAL]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for extending Weight-Space Programming tools, benchmarks, or educational labs?
  - type: textarea
    id: summary
    attributes:
      label: Proposal Summary
      description: What would you like to see added or expanded?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Scientific or Educational Motivation
      description: Why is this valuable for the WSP research community?
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Proposed Implementation Outline
      description: How should this be implemented (e.g. Python lab script, benchmark schema)?
